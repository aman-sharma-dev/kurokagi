name: CI
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go build ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
